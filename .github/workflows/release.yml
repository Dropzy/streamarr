name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web image
        run: docker build -f deploy/docker/web.Dockerfile -t ghcr.io/${{ github.repository_owner }}/streamarr-web:${{ github.ref_name }} .
      - name: Build worker image
        run: docker build -f deploy/docker/worker.Dockerfile -t ghcr.io/${{ github.repository_owner }}/streamarr-worker:${{ github.ref_name }} .
