name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: streamarr
          POSTGRES_USER: streamarr
          POSTGRES_PASSWORD: streamarr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamarr -d streamarr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://streamarr:streamarr@localhost:5432/streamarr
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          BROWSER_SOURCE_TOKEN_SECRET: ${{ secrets.CI_BROWSER_SOURCE_TOKEN_SECRET }}
